<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="420" viewBox="0 0 1200 420"
     role="img" aria-labelledby="title desc">
  <title id="title">Agency Bloom</title>
  <desc id="desc">Agency Bloom — a mobile-first WeChat Mini Program for exploring career choices, comparing possibilities, and choosing one small real-world step. The decision card stays under the user's control.</desc>

  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F6F3"/>
      <stop offset="1" stop-color="#EEF0E8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" rx="10" fill="url(#heroBg)"/>

  <!-- Right: art card frame; the photo layer is composited from themes/mist.jpg by compose-hero.mjs -->
  <rect x="768" y="64" width="362" height="324" rx="10" fill="#FFFFFF"/>
  <rect x="790" y="48" width="362" height="324" rx="8" fill="#E8E2D8"/>

  <!-- Sprout motif (project logo: brand-sprout.svg) -->
  <g transform="translate(64 76) scale(0.75)">
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M64 107V58" stroke="#648875" stroke-width="8"/>
      <path d="M62 71C40 73 24 60 21 34c24 0 40 11 41 37Z" fill="#9AB9A4" stroke="#668D75" stroke-width="3"/>
      <path d="M66 60C66 38 82 22 109 18c-2 26-18 43-43 42Z" fill="#BFD4BB" stroke="#729B81" stroke-width="3"/>
      <path d="M36 49c10 3 18 9 26 22M92 34c-10 7-19 15-26 26" stroke="#F8FBF6" stroke-opacity=".65" stroke-width="3.5"/>
    </g>
    <circle cx="64" cy="109" r="4.5" fill="#A7BDA1"/>
  </g>

  <!-- Title block -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="176" y="118" font-size="22" font-weight="600" fill="#526C49" letter-spacing="4">WECHAT MINI PROGRAM · ALPHA</text>
    <text x="170" y="196" font-size="64" font-weight="700" fill="#29374B" letter-spacing="0.5">Agency Bloom</text>
    <text x="176" y="240" font-size="24" fill="#667180">Your Life. Your Direction. Your Agency.</text>

    <line x1="176" y1="272" x2="640" y2="272" stroke="#E4E8E1" stroke-width="1"/>

    <text x="176" y="304" font-size="21" fill="#29374B">Explore career possibilities, compare choices,</text>
    <text x="176" y="332" font-size="21" fill="#29374B">and choose one small, affordable real-world step.</text>
    <text x="176" y="368" font-size="20" fill="#526C49" font-weight="600">The decision card stays under your control.</text>
  </g>

  <!-- Bottom-right: mini decision-card motif (native UI element) -->
  <g transform="translate(700 300)">
    <rect width="130" height="72" rx="8" fill="#FFFFFF" stroke="#E4E8E1"/>
    <rect x="12" y="12" width="52" height="5" rx="2.5" fill="#29374B" opacity="0.85"/>
    <rect x="12" y="26" width="86" height="4" rx="2" fill="#C6CEC2"/>
    <rect x="12" y="36" width="70" height="4" rx="2" fill="#C6CEC2"/>
    <rect x="12" y="52" width="44" height="8" rx="4" fill="#526C49"/>
  </g>
</svg>
